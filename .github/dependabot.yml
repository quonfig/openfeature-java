# Dependabot version updates (weekly, minor+patch grouped into one PR per
# ecosystem). Security updates are enabled separately on the repo and are not
# grouped, so each advisory fix arrives as its own PR. SOC 2 SSDLC, qfg-66ko.3.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - java
    open-pull-requests-limit: 5
    groups:
      java-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Runtime dependencies of the published artifacts (api/implementation,
      # plus compileOnly integrations where the customer brings their own
      # version). A major bump here raises the floor every customer must run.
      # Raise these deliberately in a release, not via Dependabot.
      - dependency-name: "dev.openfeature:sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.quonfig:sdk-java"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.fasterxml.jackson.core:*"
        update-types: ["version-update:semver-major"]
