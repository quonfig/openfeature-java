name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17"]
    steps:
      - name: Checkout openfeature-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          path: openfeature-java

      - name: Checkout integration-test-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # Pinned to a tag (not main) so a typo in shared YAML can't break
          # every SDK's CI at once. Checked out as a sibling of openfeature-java;
          # the datadir-mode tests resolve it at ../integration-test-data.
          repository: quonfig/integration-test-data
          path: integration-test-data
          ref: v2026.10.26

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v4

      - name: Test
        working-directory: openfeature-java
        run: ./gradlew test
