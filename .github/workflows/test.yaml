name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17"]
    steps:
      - name: Checkout openfeature-java
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: openfeature-java

      - name: Checkout integration-test-data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Pinned to a tag (not main) so a typo in shared YAML can't break
          # every SDK's CI at once. Checked out as a sibling of openfeature-java;
          # the datadir-mode tests resolve it at ../integration-test-data.
          repository: quonfig/integration-test-data
          path: integration-test-data
          ref: v2026.05.20

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b  # v4

      - name: Test
        working-directory: openfeature-java
        run: ./gradlew test
